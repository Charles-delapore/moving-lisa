[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "moving-lisa"
version = "0.1.0"
description = "Moving Local Indicators of Spatial Association (Moving LISA) over time"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
]
authors = [{ name = "moving-lisa contributors" }]
keywords = ["spatial", "lisa", "moran", "getis-ord", "time-geography", "pysal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
]

[project.optional-dependencies]
pandas = ["pandas"]  # for MovingLISA.to_dataframe()
geo = ["libpysal", "geopandas", "shapely"]  # weights / geometries input
dev = ["pytest", "esda", "libpysal", "pandas"]

[project.urls]
Homepage = "https://doi.org/10.1111/tgis.70158"

[tool.setuptools.packages.find]
include = ["moving_lisa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
